[project]
name = "mycode"
version = "0.1.0"
description = "基于 OpenAI 兼容 API 的交互式编程助手"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Jia Yanwei", email = "jiaywe@gmail.com" },
]
keywords = ["coding", "agent", "cli", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]
dependencies = [
    "openai>=2.0",
    "python-dotenv>=1.0",
    "prompt_toolkit>=3.0",
]

[project.scripts]
myc = "mycode.cli:main"
mycode = "mycode.cli:main"

[project.urls]
Repository = "https://github.com/hltj/mycode"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mycode"]

# ---------------------------------------------------------------------------
# 开发依赖（PEP 735 dependency-groups）
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
mypy_path = "src"
exclude = ["tests/", "build/", "dist/"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
